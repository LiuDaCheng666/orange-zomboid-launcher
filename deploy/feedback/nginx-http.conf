# Loaded only from the existing guard's http block.
limit_req_zone $binary_remote_addr zone=ozl_feedback_requests:1m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=ozl_feedback_connections:1m;
map $upstream_http_retry_after $ozl_feedback_retry_base { default $upstream_http_retry_after; "" 60; }
map $status $ozl_feedback_retry_after { default ""; 429 $ozl_feedback_retry_base; 503 $ozl_feedback_retry_base; }
