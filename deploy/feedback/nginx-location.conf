# Exact endpoint; no static files, public health check, list or read route.
location = /api/feedback {
    if ($request_method != POST) { return 405; }
    client_max_body_size 256k;
    client_body_timeout 15s;
    limit_req zone=ozl_feedback_requests burst=3 nodelay;
    limit_conn ozl_feedback_connections 2;
    access_log off;
    error_log /dev/null crit;
    add_header Cache-Control no-store always;
    add_header Retry-After $ozl_feedback_retry_after always;
    proxy_hide_header Cache-Control;
    proxy_hide_header Retry-After;
    proxy_request_buffering on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 15s;
    proxy_set_header X-OZL-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection close;
    proxy_pass http://127.0.0.1:18082;
}
