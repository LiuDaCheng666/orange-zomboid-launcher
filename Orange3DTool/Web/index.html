<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data: https://images.steamusercontent.com https://steamuserimages-a.akamaihd.net; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>OZL</title><link rel="stylesheet" href="app.css"></head>
<body><header><a class="brand" href="#home"><img class="brand-icon" src="orange-app.ico" alt="OZL"><span>OZL<small>Orange zombiod launcher</small></span></a><div class="sidebar-bottom"><span class="status-dot"></span><span id="game-state">正在读取游戏</span><button data-action="chooseGame">选择游戏目录</button></div><details class="header-menu"><summary>工具与主题</summary><div class="header-tools"><span id="connection">连接中</span><button data-core-open data-safe>启动器更新</button><button id="task-center-open" data-safe aria-haspopup="dialog">任务中心</button><button id="theme">浅蓝主题</button></div></details></header>
<div class="shell"><aside class="workspace-bar"><nav aria-label="主导航"><button data-page="home" aria-label="启动" title="启动"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5l10 7-10 7z"/></svg><span>启动</span></button><button data-page="components" aria-label="模组与组件" title="模组与组件"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z"/></svg><span>模组与组件</span></button><button data-page="saves" aria-label="存档" title="存档"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h14v16H5z M8 4v6h8V4 M8 16h8"/></svg><span>存档</span></button><button data-page="servers" aria-label="服务器" title="服务器"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h16v6H4z M4 14h16v6H4z M7 7h1 M7 17h1"/></svg><span>服务器</span></button><button data-page="memory" aria-label="内存" title="内存"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 7h14v10H5z M8 10v4 M12 10v4 M16 10v4 M8 4v3 M12 4v3 M16 4v3 M8 17v3 M12 17v3 M16 17v3"/></svg><span>内存</span></button><button data-page="settings" aria-label="设置" title="设置"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2 2 M16.4 16.4l2 2 M5.6 18.4l2-2 M16.4 7.6l2-2"/></svg><span>设置</span></button><button data-page="diagnostics" aria-label="日志分析" title="日志分析"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z M14 3v5h5 M8 12h8 M8 16h5"/></svg><span>日志分析</span></button><button data-page="help" aria-label="帮助" title="帮助"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18 M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5 M12 17v.1"/></svg><span>帮助</span></button></nav></aside>
<main><div class="workspace-context"><div id="secondary-navigation" aria-label="二级导航"></div></div><aside id="startup-update-notice" role="status" aria-live="polite" hidden><div><strong data-startup-version></strong><p>发现新版本，查看后再决定下载。</p></div><div class="actions"><button data-core-open data-safe>查看更新</button><button data-startup-dismiss data-safe aria-label="关闭更新提醒">稍后</button></div></aside><div id="notice" role="status" aria-live="polite" hidden></div><div id="task" hidden><div class="row"><span id="task-text"></span><button id="cancel" data-safe>取消任务</button></div><progress id="progress" max="100"></progress></div><section id="page" data-route="home" aria-label="页面内容"></section><footer>免费第三方辅助工具 · 组件及封面版权归原作者 <button data-page="help">版权与帮助 ↗</button></footer></main></div>
<dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-body"></p><div class="actions"><button id="confirm-no">返回</button><button id="confirm-yes" class="primary">确认继续</button></div></dialog>
<dialog id="task-center" aria-label="任务中心"><div class="row"><h2>任务中心</h2><div class="actions"><button data-task-refresh data-safe>刷新</button><button data-task-close data-safe>关闭</button></div></div><div id="task-center-content" class="section"></div></dialog>
<dialog id="playtime-reminder" aria-label="休息提醒"><span class="badge">游玩提醒</span><h2 class="section">可以休息一下了</h2><p id="reminder-dialog-time"></p><p class="small">按实际游戏进程记录。随时继续你的游戏，也可以调整提醒间隔。</p><div class="actions"><button data-reminder-modal-settings data-safe>提醒设置</button><button class="primary" data-reminder-modal-dismiss data-safe>知道了，稍后提醒</button></div></dialog>
<!-- HOME_SCENE_DATA -->
<script src="app.js"></script></body></html>
