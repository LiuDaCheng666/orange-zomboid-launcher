<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>橙子3D一键启用工具</title><link rel="stylesheet" href="app.css"></head>
<body><header><a class="brand" href="#home"><img class="brand-icon" src="orange-app.ico" alt="橙子"><span>橙子 <small>3D 一键启用工具</small></span></a><div class="header-tools"><span id="connection">连接中</span><button id="task-center-open" data-safe aria-haspopup="dialog">任务中心</button><button id="theme">浅蓝主题</button></div></header>
<div class="shell"><aside><div class="nav-label">工作空间</div><nav aria-label="主导航"><button data-page="home"><span>⌂</span>首页</button><button data-page="components"><span>▦</span>组件</button><button data-page="mods"><span>≋</span>模组配置</button><button data-page="workshop"><span>⬡</span>Steam 工坊</button><button data-page="saves"><span>▣</span>存档</button><button data-page="servers"><span>◎</span>服务器</button><button data-page="shaders"><span>☼</span>光影</button><button data-page="settings"><span>≡</span>画面设置</button><button data-page="memory"><span>▤</span>内存</button><button data-page="maintenance"><span>◇</span>维护</button><button data-page="help"><span>?</span>帮助</button></nav><div class="sidebar-bottom"><span class="status-dot"></span><span id="game-state">正在读取游戏</span><button data-action="chooseGame">选择游戏目录</button><small>ORANGE · 第三方辅助工具</small></div></aside>
<main><div id="notice" role="status" aria-live="polite" hidden></div><div id="task" hidden><div class="row"><span id="task-text"></span><button id="cancel" data-safe>取消任务</button></div><progress id="progress" max="100"></progress></div><section id="page" data-route="home" aria-label="页面内容"></section><footer>免费第三方辅助工具 · 组件及封面版权归原作者 <button data-page="help">版权与帮助 ↗</button></footer></main></div>
<dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-body"></p><div class="actions"><button id="confirm-no">返回</button><button id="confirm-yes" class="primary">确认继续</button></div></dialog>
<dialog id="task-center" aria-label="任务中心"><div class="row"><h2>任务中心</h2><div class="actions"><button data-task-refresh data-safe>刷新</button><button data-task-close data-safe>关闭</button></div></div><div id="task-center-content" class="section"></div></dialog>
<dialog id="playtime-reminder" aria-label="休息提醒"><span class="badge">游玩提醒</span><h2 class="section">可以休息一下了</h2><p id="reminder-dialog-time"></p><p class="small">按实际游戏进程记录。随时继续你的游戏，也可以调整提醒间隔。</p><div class="actions"><button data-reminder-modal-settings data-safe>提醒设置</button><button class="primary" data-reminder-modal-dismiss data-safe>知道了，稍后提醒</button></div></dialog>
<script src="app.js"></script></body></html>
